[project]
name = "video-insights-labeling"
version = "0.1.0"
description = "CLI tool for video transcription, AI labeling, and reel generation"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "faster-whisper>=1.0",
    "anthropic>=0.25.0",
    "ffmpeg-python>=0.2.0",
]

[project.optional-dependencies]
diarization = ["pyannote.audio>=3.1"]

[project.scripts]
vil = "src.main:cli"

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
